<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Glowing Card Gradients -->
    <linearGradient id="hypersphereGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="audioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <linearGradient id="visionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b3c" />
      <stop offset="100%" stop-color="#113e38" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="720" fill="url(#bgGrad)" />

  <!-- Background Decorative Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="720" />
    <line x1="300" y1="0" x2="300" y2="720" />
    <line x1="600" y1="0" x2="600" y2="720" />
    <line x1="900" y1="0" x2="900" y2="720" />
    <line x1="1100" y1="0" x2="1100" y2="720" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="480" x2="1200" y2="480" />
  </g>

  <!-- Header Section -->
  <g transform="translate(60, 45)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
    <text x="110" y="17" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">GOOGLE DEEPMIND ARCHITECTURE</text>

    <!-- Main Title -->
    <text x="0" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">EmbeddingGemma 2: Modular Modality Pyramid</text>
    <text x="0" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Sub-1B on-device multimodal embeddings projecting all sensory inputs into a unified 768d latent hypersphere</text>
  </g>

  <!-- ======================================================== -->
  <!-- TOP LEVEL: SHARED 768-DIMENSIONAL EMBEDDING HYPERSPHERE  -->
  <!-- ======================================================== -->
  <g transform="translate(60, 155)">
    <!-- Main Outer Container -->
    <rect x="0" y="0" width="1080" height="110" rx="20" fill="#0f172a" stroke="url(#hypersphereGrad)" stroke-width="2.5" filter="url(#glowPurple)" opacity="0.95" />
    <rect x="0" y="0" width="1080" height="110" rx="20" fill="#0f172a" stroke="#475569" stroke-width="1" />

    <!-- Sphere Visual Icon -->
    <g transform="translate(45, 55)">
      <circle cx="0" cy="0" r="32" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
      <ellipse cx="0" cy="0" rx="32" ry="12" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 2" />
      <ellipse cx="0" cy="0" rx="12" ry="32" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 2" />
      <circle cx="0" cy="0" r="5" fill="#38bdf8" />
    </g>

    <text x="100" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Unified 768-Dimensional Embedding Hypersphere</text>
    <text x="100" y="68" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">All modalities converge to unit-length vectors (||v||₂ = 1.0) • Direct Cosine Similarity via Dot Product (v₁ • v₂)</text>
    <text x="100" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-family="monospace">Output: float32[768] (3,072 bytes) • Native Matryoshka Slicing Support (512d / 256d / 128d)</text>

    <!-- Metric Badges on Right -->
    <g transform="translate(860, 25)">
      <rect x="0" y="0" width="190" height="28" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <text x="95" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Cross-Modal Dot Product: O(d)</text>

      <rect x="0" y="34" width="190" height="28" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" />
      <text x="95" y="52" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Cosine Norm: ||v|| = 1.0000</text>
    </g>
  </g>

  <!-- Convergence Flow Arrows -->
  <g stroke="#64748b" stroke-width="2" stroke-dasharray="5 3" fill="none">
    <!-- From Audio to Hypersphere -->
    <path d="M 230 330 L 230 270" marker-end="url(#arrow)" stroke="#a855f7" />
    <!-- From Vision to Hypersphere -->
    <path d="M 600 330 L 600 270" marker-end="url(#arrow)" stroke="#06b6d4" />
    <!-- From Text to Hypersphere -->
    <path d="M 970 330 L 970 270" marker-end="url(#arrow)" stroke="#3b82f6" />
  </g>

  <!-- ======================================================== -->
  <!-- MODULAR PYRAMID TOWERS (3 COLUMNS)                        -->
  <!-- ======================================================== -->

  <!-- TOWER 1: AUDIO TOWER (+300M params) -->
  <g transform="translate(60, 335)">
    <rect x="0" y="0" width="340" height="270" rx="18" fill="url(#audioGrad)" stroke="#a855f7" stroke-width="1.8" />
    
    <!-- Header -->
    <rect x="18" y="16" width="130" height="24" rx="6" fill="#3b0764" stroke="#c084fc" stroke-width="1" />
    <text x="83" y="32" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">AUDIO TOWER</text>
    <text x="320" y="33" fill="#c084fc" font-family="monospace" font-size="13" font-weight="700" text-anchor="end">+300M PARAMS</text>

    <text x="18" y="68" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Raw Acoustic Waveforms</text>
    <text x="18" y="90" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Direct acoustic latent ingestion without ASR</text>

    <!-- Feature Specs Box -->
    <rect x="16" y="105" width="308" height="100" rx="10" fill="#0b0f19" stroke="#581c87" stroke-width="1" />
    <text x="28" y="128" fill="#d8b4fe" font-family="monospace" font-size="11">• Sampling Rate: 16,000 Hz Mono</text>
    <text x="28" y="150" fill="#d8b4fe" font-family="monospace" font-size="11">• Max Duration: 30s audio chunks</text>
    <text x="28" y="172" fill="#d8b4fe" font-family="monospace" font-size="11">• Acoustic Features: Spectral flux, pitch</text>
    <text x="28" y="192" fill="#d8b4fe" font-family="monospace" font-size="11">• Cumulative Model Size: 740M params</text>

    <!-- Memory Footprint Tag -->
    <rect x="16" y="218" width="308" height="36" rx="8" fill="#1e1b4b" stroke="#7e22ce" stroke-width="1" />
    <text x="170" y="241" fill="#f3e8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ RAM Usage: ~1.48 GB (FP16)</text>
  </g>

  <!-- TOWER 2: VISION & DOCUMENT TOWER (+170M params) -->
  <g transform="translate(430, 335)">
    <rect x="0" y="0" width="340" height="270" rx="18" fill="url(#visionGrad)" stroke="#06b6d4" stroke-width="1.8" />
    
    <!-- Header -->
    <rect x="18" y="16" width="130" height="24" rx="6" fill="#083344" stroke="#22d3ee" stroke-width="1" />
    <text x="83" y="32" fill="#cffafe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">VISION TOWER</text>
    <text x="320" y="33" fill="#22d3ee" font-family="monospace" font-size="13" font-weight="700" text-anchor="end">+170M PARAMS</text>

    <text x="18" y="68" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Images, PDFs &amp; Video</text>
    <text x="18" y="90" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Multi-page PDFs, slides, and 1 fps video</text>

    <!-- Feature Specs Box -->
    <rect x="16" y="105" width="308" height="100" rx="10" fill="#0b0f19" stroke="#155e75" stroke-width="1" />
    <text x="28" y="128" fill="#67e8f9" font-family="monospace" font-size="11">• Image Formats: JPEG, PNG, WebP</text>
    <text x="28" y="150" fill="#67e8f9" font-family="monospace" font-size="11">• PDF Parsing: Multi-page layout aware</text>
    <text x="28" y="172" fill="#67e8f9" font-family="monospace" font-size="11">• Video: Uniform 1 fps keyframe sampling</text>
    <text x="28" y="192" fill="#67e8f9" font-family="monospace" font-size="11">• Cumulative Model Size: 440M params</text>

    <!-- Memory Footprint Tag -->
    <rect x="16" y="218" width="308" height="36" rx="8" fill="#0c4a6e" stroke="#0891b2" stroke-width="1" />
    <text x="170" y="241" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ RAM Usage: ~880 MB (FP16)</text>
  </g>

  <!-- TOWER 3: TEXT & CODE FOUNDATION (270M params) -->
  <g transform="translate(800, 335)">
    <rect x="0" y="0" width="340" height="270" rx="18" fill="url(#textGrad)" stroke="#3b82f6" stroke-width="1.8" />
    
    <!-- Header -->
    <rect x="18" y="16" width="130" height="24" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1" />
    <text x="83" y="32" fill="#dbeafe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TEXT &amp; CODE BASE</text>
    <text x="320" y="33" fill="#60a5fa" font-family="monospace" font-size="13" font-weight="700" text-anchor="end">270M PARAMS</text>

    <text x="18" y="68" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Adapted Gemma 4 Decoder</text>
    <text x="18" y="90" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Ultra-lean on-device semantic base</text>

    <!-- Feature Specs Box -->
    <rect x="16" y="105" width="308" height="100" rx="10" fill="#0b0f19" stroke="#1d4ed8" stroke-width="1" />
    <text x="28" y="128" fill="#93c5fd" font-family="monospace" font-size="11">• Context Window: 8,192 tokens</text>
    <text x="28" y="150" fill="#93c5fd" font-family="monospace" font-size="11">• MTEB Code Benchmark: +14% vs EG 1</text>
    <text x="28" y="172" fill="#93c5fd" font-family="monospace" font-size="11">• Asymmetric Task Prefixes: Query/Doc</text>
    <text x="28" y="192" fill="#93c5fd" font-family="monospace" font-size="11">• Base Parameters: 270M (leanest tier)</text>

    <!-- Memory Footprint Tag -->
    <rect x="16" y="218" width="308" height="36" rx="8" fill="#1e3a8a" stroke="#2563eb" stroke-width="1" />
    <text x="170" y="241" fill="#eff6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ RAM Usage: ~540 MB (FP16)</text>
  </g>

  <!-- ======================================================== -->
  <!-- BOTTOM SUMMARY BAR: MODULAR COMPOSITION ADVANTAGE        -->
  <!-- ======================================================== -->
  <g transform="translate(60, 625)">
    <rect x="0" y="0" width="1080" height="55" rx="14" fill="#0b0f19" stroke="#334155" stroke-width="1.2" />
    <text x="30" y="32" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🚀 Production Modularity:</text>
    <text x="195" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Only load the towers required for your workload: Text/Code Only (270M / 540MB) ➔ +Vision (440M / 880MB) ➔ Full Multimodal (740M / 1.5GB).</text>
  </g>
</svg>
