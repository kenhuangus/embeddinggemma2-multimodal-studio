<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Vector Bar Gradients -->
    <linearGradient id="grad768" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="grad512" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="grad256" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="grad128" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="720" fill="url(#bgGrad2)" />

  <!-- Background Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="80" y1="0" x2="80" y2="720" />
    <line x1="400" y1="0" x2="400" y2="720" />
    <line x1="800" y1="0" x2="800" y2="720" />
    <line x1="1120" y1="0" x2="1120" y2="720" />
    <line x1="0" y1="130" x2="1200" y2="130" />
    <line x1="0" y1="460" x2="1200" y2="460" />
  </g>

  <!-- Header Section -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="230" height="26" rx="13" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
    <text x="115" y="17" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">DYNAMIC VECTOR SLICING (MRL)</text>

    <text x="0" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">Matryoshka Representation Learning &amp; Storage Compression</text>
    <text x="0" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Nested semantic representation enables up to 6.0x memory reduction with 98.4% retrieval accuracy retention</text>
  </g>

  <!-- ======================================================== -->
  <!-- LEFT PANEL: NESTED VECTOR SLICING BREAKDOWN              -->
  <!-- ======================================================== -->
  <g transform="translate(60, 140)">
    <!-- Container Card -->
    <rect x="0" y="0" width="680" height="360" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.2" />

    <text x="24" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Multi-Granularity Slicing Tiers</text>
    <text x="24" y="54" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Earlier vector dimensions capture highest-variance semantic features</text>

    <!-- Tier 1: Full 768d -->
    <g transform="translate(24, 75)">
      <text x="0" y="16" fill="#cbd5e1" font-family="monospace" font-size="12" font-weight="700">768d (Master)</text>
      <rect x="120" y="0" width="400" height="28" rx="6" fill="url(#grad768)" opacity="0.9" />
      <text x="320" y="18" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">[0 ........................................ 767]</text>
      
      <rect x="535" y="0" width="95" height="28" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="582" y="18" fill="#c7d2fe" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">3,072 B (1.0x)</text>
    </g>

    <!-- Tier 2: 512d -->
    <g transform="translate(24, 125)">
      <text x="0" y="16" fill="#cbd5e1" font-family="monospace" font-size="12" font-weight="700">512d (High)</text>
      <rect x="120" y="0" width="266" height="28" rx="6" fill="url(#grad512)" opacity="0.9" />
      <rect x="386" y="0" width="134" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
      <text x="253" y="18" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">[0 ................. 511]</text>
      <text x="453" y="18" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">Truncated</text>

      <rect x="535" y="0" width="95" height="28" rx="6" fill="#083344" stroke="#06b6d4" stroke-width="1" />
      <text x="582" y="18" fill="#a5f3fc" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">2,048 B (1.5x)</text>
    </g>

    <!-- Tier 3: 256d -->
    <g transform="translate(24, 175)">
      <text x="0" y="16" fill="#cbd5e1" font-family="monospace" font-size="12" font-weight="700">256d (Compact)</text>
      <rect x="120" y="0" width="133" height="28" rx="6" fill="url(#grad256)" opacity="0.9" />
      <rect x="253" y="0" width="267" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
      <text x="186" y="18" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">[0 ... 255]</text>
      <text x="386" y="18" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">Truncated</text>

      <rect x="535" y="0" width="95" height="28" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <text x="582" y="18" fill="#a7f3d0" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">1,024 B (3.0x)</text>
    </g>

    <!-- Tier 4: 128d -->
    <g transform="translate(24, 225)">
      <text x="0" y="16" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="800">128d (Edge)</text>
      <rect x="120" y="0" width="67" height="28" rx="6" fill="url(#grad128)" opacity="0.95" />
      <rect x="187" y="0" width="333" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
      <text x="153" y="18" fill="#000000" font-family="monospace" font-size="10" font-weight="800" text-anchor="middle">0..127</text>
      <text x="353" y="18" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">Truncated Dimensions (640 dims)</text>

      <rect x="535" y="0" width="95" height="28" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1" />
      <text x="582" y="18" fill="#fef3c7" font-family="monospace" font-size="11" font-weight="800" text-anchor="middle">512 B (6.0x)</text>
    </g>

    <!-- Formula Box -->
    <g transform="translate(24, 280)">
      <rect x="0" y="0" width="632" height="60" rx="10" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="24" fill="#60a5fa" font-family="monospace" font-size="11" font-weight="700">Euclidean L2 Re-normalization Rule (Mandatory):</text>
      <text x="16" y="46" fill="#f8fafc" font-family="monospace" font-size="12">v_norm = v[:d] / np.linalg.norm(v[:d])   ➔  ||v_norm||₂ = 1.0000</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- RIGHT PANEL: ACCURACY RETENTION & ENTERPRISE IMPACT      -->
  <!-- ======================================================== -->
  <g transform="translate(760, 140)">
    <!-- Container Card -->
    <rect x="0" y="0" width="380" height="360" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.2" />

    <text x="24" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">MTEB Retrieval Retention</text>
    <text x="24" y="54" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Accuracy vs Storage Compression Ratio</text>

    <!-- Comparison Table -->
    <g transform="translate(24, 75)">
      <!-- Row 768d -->
      <rect x="0" y="0" width="332" height="38" rx="8" fill="#1e293b" />
      <text x="16" y="24" fill="#e2e8f0" font-family="monospace" font-size="12">768d Baseline</text>
      <text x="180" y="24" fill="#94a3b8" font-family="monospace" font-size="11">1.0x Storage</text>
      <text x="315" y="24" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">100.0%</text>

      <!-- Row 512d -->
      <rect x="0" y="44" width="332" height="38" rx="8" fill="#1e293b" />
      <text x="16" y="68" fill="#e2e8f0" font-family="monospace" font-size="12">512d Sliced</text>
      <text x="180" y="68" fill="#94a3b8" font-family="monospace" font-size="11">1.5x Storage</text>
      <text x="315" y="68" fill="#34d399" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">99.8%</text>

      <!-- Row 256d -->
      <rect x="0" y="88" width="332" height="38" rx="8" fill="#1e293b" />
      <text x="16" y="112" fill="#e2e8f0" font-family="monospace" font-size="12">256d Sliced</text>
      <text x="180" y="112" fill="#94a3b8" font-family="monospace" font-size="11">3.0x Storage</text>
      <text x="315" y="112" fill="#34d399" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">99.1%</text>

      <!-- Row 128d -->
      <rect x="0" y="132" width="332" height="42" rx="8" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="16" y="158" fill="#fde68a" font-family="monospace" font-size="12" font-weight="700">128d Ultra-Lean</text>
      <text x="180" y="158" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="600">6.0x Storage</text>
      <text x="315" y="158" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="800" text-anchor="end">98.4% ⭐</text>
    </g>

    <!-- Production Impact Callout -->
    <g transform="translate(24, 275)">
      <rect x="0" y="0" width="332" height="65" rx="10" fill="#0b0f19" stroke="#10b981" stroke-width="1" />
      <text x="16" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">💡 10M Vectors in Vector DB (HNSW):</text>
      <text x="16" y="46" fill="#cbd5e1" font-family="monospace" font-size="11">• 768d: 30.72 GB RAM ➔ 128d: 5.12 GB RAM</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- BOTTOM SECTION: TWO-STAGE RETRIEVAL ARCHITECTURE         -->
  <!-- ======================================================== -->
  <g transform="translate(60, 520)">
    <rect x="0" y="0" width="1080" height="155" rx="16" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2" />

    <text x="30" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Recommended Two-Stage Production Pipeline</text>
    <text x="30" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Combining high-speed low-cost filtering with full precision re-ranking</text>

    <!-- Stage 1 Box -->
    <g transform="translate(30, 68)">
      <rect x="0" y="0" width="480" height="65" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="1" />
      <text x="20" y="26" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Stage 1: Fast ANN Candidate Retrieval (128d)</text>
      <text x="20" y="48" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Query 10M items in 5GB RAM index in &lt;5ms. Retrieve top-100 candidates.</text>
    </g>

    <!-- Arrow -->
    <g transform="translate(525, 95)">
      <path d="M 0 5 L 20 5" stroke="#38bdf8" stroke-width="3" />
      <polygon points="20,0 30,5 20,10" fill="#38bdf8" />
    </g>

    <!-- Stage 2 Box -->
    <g transform="translate(570, 68)">
      <rect x="0" y="0" width="480" height="65" rx="10" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1" />
      <text x="20" y="26" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Stage 2: Precision Re-Ranking (768d)</text>
      <text x="20" y="48" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Re-score the 100 candidate items using full 768d vectors for exact ranking.</text>
    </g>
  </g>
</svg>
