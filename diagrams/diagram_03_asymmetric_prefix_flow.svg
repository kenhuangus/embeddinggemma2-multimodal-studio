<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Query Stream Gradient -->
    <linearGradient id="queryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Document Stream Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>

    <!-- Dot Product Matrix Gradient -->
    <linearGradient id="matrixGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" fill="url(#bgGrad3)" />

  <!-- Background Decorative Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="120" y1="0" x2="120" y2="680" />
    <line x1="600" y1="0" x2="600" y2="680" />
    <line x1="1080" y1="0" x2="1080" y2="680" />
    <line x1="0" y1="130" x2="1200" y2="130" />
    <line x1="0" y1="500" x2="1200" y2="500" />
  </g>

  <!-- Header Section -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="260" height="26" rx="13" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" />
    <text x="130" y="17" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">ASYMMETRIC INSTRUCTION PIPELINE</text>

    <text x="0" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">Asymmetric Task Prefix &amp; Semantic Matching Flow</text>
    <text x="0" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Aligning concise search queries with dense multimodal documents in a unified vector hypersphere</text>
  </g>

  <!-- ======================================================== -->
  <!-- LEFT STREAM: QUERY ENCODING PATH                          -->
  <!-- ======================================================== -->
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="480" height="340" rx="18" fill="url(#queryGrad)" stroke="#6366f1" stroke-width="1.5" />

    <!-- Stream Header -->
    <rect x="20" y="20" width="160" height="26" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
    <text x="100" y="37" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🔍 QUERY PIPELINE</text>

    <text x="20" y="75" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">1. User Search Query</text>
    <text x="20" y="95" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">"What is the time complexity of quicksort?"</text>

    <!-- Asymmetric Prefix Injection Box -->
    <rect x="20" y="115" width="440" height="85" rx="10" fill="#0b0f19" stroke="#4f46e5" stroke-width="1.2" />
    <text x="35" y="138" fill="#818cf8" font-family="monospace" font-size="11" font-weight="700">Prompt Prefix: task: SearchQuery</text>
    <text x="35" y="160" fill="#e2e8f0" font-family="monospace" font-size="11">model.encode(query, prompt_name="SearchQuery")</text>
    <text x="35" y="182" fill="#94a3b8" font-family="monospace" font-size="10">Instructs model to encode intent as a retrieval probe</text>

    <!-- Normalized Vector Output -->
    <rect x="20" y="220" width="440" height="95" rx="10" fill="#0b0f19" stroke="#334155" stroke-width="1" />
    <text x="35" y="244" fill="#a5b4fc" font-family="monospace" font-size="11" font-weight="700">Output Query Vector: q_vec (float32[768])</text>
    <text x="35" y="268" fill="#38bdf8" font-family="monospace" font-size="11">||q_vec||₂ = 1.0000  (Unit Hypersphere)</text>
    <text x="35" y="292" fill="#34d399" font-family="monospace" font-size="11">Optional 128d Slice: q_128 = q[:128] / ||q[:128]||</text>
  </g>

  <!-- ======================================================== -->
  <!-- RIGHT STREAM: DOCUMENT & MULTIMODAL INGESTION PATH       -->
  <!-- ======================================================== -->
  <g transform="translate(660, 140)">
    <rect x="0" y="0" width="480" height="340" rx="18" fill="url(#docGrad)" stroke="#06b6d4" stroke-width="1.5" />

    <!-- Stream Header -->
    <rect x="20" y="20" width="180" height="26" rx="6" fill="#083344" stroke="#22d3ee" stroke-width="1" />
    <text x="110" y="37" fill="#cffafe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">📄 CORPUS PIPELINE</text>

    <text x="20" y="75" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">2. Multimodal Corpus Passages</text>
    <text x="20" y="95" fill="#a5f3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Text docs, audio waveforms, video frames, PDFs</text>

    <!-- Asymmetric Prefix Injection Box -->
    <rect x="20" y="115" width="440" height="85" rx="10" fill="#0b0f19" stroke="#0891b2" stroke-width="1.2" />
    <text x="35" y="138" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="700">Prompt Prefix: task: Document</text>
    <text x="35" y="160" fill="#e2e8f0" font-family="monospace" font-size="11">model.encode(doc, prompt_name="Document")</text>
    <text x="35" y="182" fill="#94a3b8" font-family="monospace" font-size="10">Instructs model to encode passage as an indexable target</text>

    <!-- Normalized Vector Output -->
    <rect x="20" y="220" width="440" height="95" rx="10" fill="#0b0f19" stroke="#334155" stroke-width="1" />
    <text x="35" y="244" fill="#67e8f9" font-family="monospace" font-size="11" font-weight="700">Output Doc Vector: d_vec (float32[768])</text>
    <text x="35" y="268" fill="#38bdf8" font-family="monospace" font-size="11">||d_vec||₂ = 1.0000  (Unit Hypersphere)</text>
    <text x="35" y="292" fill="#34d399" font-family="monospace" font-size="11">Optional 128d Slice: d_128 = d[:128] / ||d[:128]||</text>
  </g>

  <!-- ======================================================== -->
  <!-- CENTER / BOTTOM: SIMILARITY DOT PRODUCT INTERSECTION     -->
  <!-- ======================================================== -->
  <g transform="translate(60, 505)">
    <rect x="0" y="0" width="1080" height="145" rx="16" fill="#0f172a" stroke="url(#matrixGrad)" stroke-width="1.8" />

    <g transform="translate(35, 30)">
      <text x="0" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Dot-Product Cosine Similarity Matrix</text>
      <text x="0" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Because vectors are unit-normalized, dot product equals cosine similarity exactly:</text>
      
      <!-- Math Formula Box -->
      <g transform="translate(0, 55)">
        <rect x="0" y="0" width="450" height="36" rx="8" fill="#0b0f19" stroke="#10b981" stroke-width="1" />
        <text x="225" y="23" fill="#34d399" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">Cosine Similarity = dot(q_vec, d_vec) ∈ [-1.0, 1.0]</text>
      </g>
    </g>

    <!-- Asymmetric Rule Tag on Right -->
    <g transform="translate(560, 25)">
      <rect x="0" y="0" width="485" height="95" rx="10" fill="#0b0f19" stroke="#334155" stroke-width="1" />
      <text x="20" y="26" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">⚠️ Production Requirement: Never Omit Task Prefixes</text>
      <text x="20" y="48" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Omitting `prompt_name` causes symmetric similarity collapse, degrading</text>
      <text x="20" y="66" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">retrieval MRR by over 24%. Always pair `SearchQuery` queries with</text>
      <text x="20" y="84" fill="#a5f3fc" font-family="monospace" font-size="11">`Document` passages for maximum semantic contrast.</text>
    </g>
  </g>
</svg>
